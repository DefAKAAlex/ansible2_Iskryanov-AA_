- name: Update_cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install_Apache
  apt:
    name: apache2
    state: present

- name: Create_index
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: '0644'
  notify: restart apache

- name: Check_Apache
  systemd:
    name: apache2
    state: started
    enabled: yes

- name: Allow_firewall
  ufw:
    rule: allow
    port: '80'
    proto: tcp
  when: ansible_facts.ufw.active == true
  ignore_errors: yes

- name: Check_website_accessible
  uri:
    url: "http://{{ ansible_default_ipv4.address }}"
    status_code: 200
    return_content: yes
  register: website_status
  failed_when: website_status.status != 200
  delegate_to: localhost  # Проверяем с control node
